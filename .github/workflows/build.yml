name: build-image

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build container
        run: docker build -t meshcore-sensecap-m2-build build/

      - name: Cache OpenWrt downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dl
          key: openwrt-dl-${{ hashFiles('target/sensecap-m2/config.seed', 'feed/**/Makefile') }}
          restore-keys: openwrt-dl-

      - name: Build
        run: |
          mkdir -p ${{ runner.temp }}/work ${{ runner.temp }}/dl
          sudo chown 1000:1000 ${{ runner.temp }}/work ${{ runner.temp }}/dl
          docker run --rm \
            -v ${{ runner.temp }}/work:/work \
            -v ${{ runner.temp }}/dl:/work/dl-cache \
            -v ${{ github.workspace }}:/src:ro \
            -e JOBS=$(nproc) -e DL_CACHE=/work/dl-cache \
            meshcore-sensecap-m2-build /src/build/build.sh all

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp ${{ runner.temp }}/work/openwrt/bin/targets/ramips/mt76x8/*sensecap*sysupgrade.bin out/
          cp ${{ runner.temp }}/work/openwrt/bin/targets/ramips/mt76x8/sha256sums out/ || true
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meshcore-sensecap-m2-image
          path: out/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: out/*
